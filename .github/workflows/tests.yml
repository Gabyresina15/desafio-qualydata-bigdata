name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias mínimas
        run: pip install duckdb polars pyarrow numpy psutil
      - name: Correr tests de humo
        run: python -m unittest discover -s tests -v
